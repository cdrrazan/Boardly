# Auto-deploy the landing page (web/) to Cloudflare Pages on every push to the
# web-app branch. Uses the Direct Upload flow — this workflow uploads the static
# site with Wrangler, so the Cloudflare Pages project must be a "Direct Upload"
# project (do NOT also connect it to Git, or you'll get double deploys).
#
# One-time setup:
#   1. Create a Pages project named "boardly" (Direct Upload), production branch web-app.
#      Easiest: `npx wrangler pages project create boardly --production-branch web-app`
#   2. Add two repo secrets (Settings → Secrets and variables → Actions):
#        CLOUDFLARE_API_TOKEN   — token with the "Cloudflare Pages: Edit" permission
#        CLOUDFLARE_ACCOUNT_ID  — your account ID (Cloudflare dashboard → Workers & Pages)
name: Deploy web

on:
  push:
    branches: [web-app]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

# Never run two deploys of this site at once; let the newest win.
concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish web/ to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web --project-name=boardly --branch=web-app --commit-dirty=true

      - name: Report deployment URL
        if: ${{ steps.deploy.outputs.deployment-url != '' }}
        run: echo "🚀 Deployed to ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
